[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
buildCommand = "echo 'Using Dockerfile multi-stage for MaskPanel by RunoFlux'"

[deploy]
startCommand = "/code/start.sh"
healthcheckPath = "/api/system"
healthcheckTimeout = 300
restartPolicyType = "onFailure"
restartPolicyMaxRetries = 5

# Railway will inject PORT, we handle it in start.sh
