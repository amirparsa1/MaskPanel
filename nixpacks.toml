# RunoFlux MaskPanel - Nixpacks config for Railway
# If Dockerfile fails, Railway will use this

[phases.setup]
nixPkgs = ["python314", "nodejs_22", "bun"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install uv && uv sync --frozen --no-dev",
  "cd dashboard && bun install --frozen-lockfile || npm install --legacy-peer-deps"
]

[phases.build]
cmds = [
  "cd dashboard && VITE_BASE_API=/ bun run build || npm run build",
  "cp dashboard/build/index.html dashboard/build/404.html || true",
  "ls -lh dashboard/build/"
]

[start]
cmd = "/code/start.sh"

[variables]
UVICORN_HOST = "0.0.0.0"
ROLE = "all-in-one"
NATS_ENABLED = "0"
VITE_BASE_API = "/"
